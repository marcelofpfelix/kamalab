#!KAMAILIO

#!defenvs KAMA_LISTEN
listen=KAMA_LISTEN
auto_aliases=no

loadmodule "tm"
loadmodule "xlog"
loadmodule "pv"
loadmodule "sl"
loadmodule "textops"

# request_route - Main route for incoming requests
request_route {
    xlog("L_INFO", "=== REQUEST_ROUTE ===\n");
    xlog("L_INFO", "Method: $rm | URI: $ru | From: $fu\n");
    xlog("L_INFO", "Source: $si:$sp | Proto: $proto\n");

    # Set transaction to use named reply route
    t_on_reply("CUSTOM_REPLY");

    # For testing, relay to a backend or send local reply
    if ($rm == "OPTIONS") {
        xlog("L_INFO", "Handling OPTIONS locally\n");
        sl_send_reply(200, "OK - Native Route");
        exit;
    }

    # Forward other requests (uncomment and configure destination)
    # t_relay_to_udp("10.0.0.2", "5060");

    # For testing without backend, send reply
    sl_send_reply(200, "Processed by Native Route");
}

# reply_route - Runs for ALL replies (executed first)
reply_route {
    xlog("L_INFO", "=== REPLY_ROUTE (Global) ===\n");
    xlog("L_INFO", "Status: $rs $rr | Method: $rm\n");
    xlog("L_INFO", "Reply from: $si:$sp\n");
}

# onreply_route - Named reply route (runs after reply_route)
onreply_route[CUSTOM_REPLY] {
    xlog("L_INFO", "=== ONREPLY_ROUTE[CUSTOM_REPLY] ===\n");
    xlog("L_INFO", "Custom handling for reply: $rs $rr\n");

    # Add custom header to reply
    append_hf("X-Kamailio-Route: Native\r\n");
}

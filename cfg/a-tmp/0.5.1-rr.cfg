#!KAMAILIO

loadmodule "tm"
loadmodule "xlog"
loadmodule "pv"
loadmodule "sl"
loadmodule "rr"


#!defenvs KAMA_LISTEN
listen=KAMA_LISTEN
auto_aliases=no
//alias="domain.invalid"

request_route {
    // Enable record_routing so we see the Mid Dialog requests
    //record_route();
    record_route_preset("domain.invalid");

    xlog("Got a request $rm to $ru\n");

    t_on_reply("TM_REPLY");

    t_relay("127.0.0.3","5001");
}

reply_route{
    // this route will always run first
    xlog("Got a reply $rs $rm\n");

}

onreply_route[TM_REPLY] {
    // replies from route[TM_REPLY]

    xlog("Got a TM_REPLY $rs $rm\n");

}

#!KAMAILIO

#!defenvs KAMA_LISTEN
listen=KAMA_LISTEN
auto_aliases=no

loadmodule "tm"
loadmodule "tmx"

loadmodule "sl"
loadmodule "xlog"
loadmodule "pv"

#!define ENV_DELAY_T38_SLEEPTIME        400
loadmodule "async.so"
modparam("async", "workers", 2)
#  - timer resolution in milliseconds, set to a multiple of the sleep in async_ms_route
modparam("async", "ms_timer", 25)
loadmodule "ctl"
# PROXY-1079 - set custom parameter for the async_ms_route sleep time
loadmodule "cfg_rpc"
ibp.delay_t38_sleeptime = ENV_DELAY_T38_SLEEPTIME;
async_workers=2


request_route {
    $var(a)=$sel(cfg_get.ibp.delay_t38_sleeptime);
    xlog("Got a request $rm to $fU, $$var(sleep): $var(a) / $sel(cfg_get.ibp.delay_t38_sleeptime)\n");
    t_newtran();
    async_ms_route("RESUME", "$(sel(cfg_get.ibp.delay_t38_sleeptime){s.int})");


}

route[RESUME] {
    xlog("  In a route $$var(pid): $var(pid)\n");
        t_send_reply(200, "OK");

    exit;
}

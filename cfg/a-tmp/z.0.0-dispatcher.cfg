#!KAMAILIO

// testing dispatcher

#!defenvs KAMA_LISTEN
listen=KAMA_LISTEN
auto_aliases=no

loadmodule "tm"
loadmodule "sl"
loadmodule "xlog"
loadmodule "pv"
loadmodule "ctl"
loadmodule "dispatcher"

modparam("dispatcher", "list_file", "/etc/kamailio/sh/kam/dispatcher.list")
// failover support is enabled
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "ds_ping_interval", 10)
// attempt to probe a gateway 2 times before marking it as down
modparam("dispatcher", "ds_probing_threshold", 2)
// valid reply to ping
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=403;code=488;class=3")
// all gateways are tested
modparam("dispatcher", "ds_probing_mode", 1)
// enable latency statistics
modparam("dispatcher", "ds_ping_latency_stats", 1)

# PROXY-993 - no reply for a request timer
modparam("tm", "fr_timer", 3000)
# No-answer timeout (for failover) (milliseconds)
modparam("tm", "fr_inv_timer", 180000)

request_route {

    if(ds_select_dst(100, 13)) {
        # we got a destination for MS
        xlog("L_ERR", "[$ci][$csb] Using ds_select_dst function ($du)\n");
        t_on_failure("RTF_DISPATCH");
        t_relay();
        exit;
    } else {
        xlog("L_ERR","[$ci][$csb] No active gateways available -> 503\n");
        send_reply("503", "No destination available S59");
        exit;
    }

}

failure_route[RTF_DISPATCH] {
    # Don't retry on CANCEL
    if (t_is_canceled()) {
        exit;
    }

    # Retry on branch timeout (no response from gateway) or any 5xx reply.
    # t_branch_timeout() is true when fr_timer/fr_inv_timer expired with no
    # reply — this is the real "gateway didn't answer" case, as opposed to
    # an actual 408 sent back by the gateway.
    if (t_branch_timeout() || !t_branch_replied() || t_check_status("5[0-9][0-9]")) {
        if (ds_next_dst()) {
            xlog("L_ERR", "[$ci][$csb] Failing over to $du\n");
            t_on_failure("RTF_DISPATCH");
            t_relay();
            exit;
        }
        xlog("L_ERR", "[$ci][$csb] No more gateways to try\n");
    }
}
